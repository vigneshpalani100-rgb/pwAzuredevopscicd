trigger:
  - main

jobs:
- job: Parallel_OS_Execution
  displayName: 'Run Tests in Parallel Across OS'
  strategy:
    maxParallel: 3
    matrix:
      Linux_Ubuntu:
        imageName: 'ubuntu-latest'
      macOS:
        imageName: 'macOS-latest'
      Windows:
        imageName: 'windows-latest'

  pool:
    vmImage: $(imageName)

  steps:
  # 1. Install JDK 25
  - task: JavaToolInstaller@0
    displayName: 'Install & Set JDK 25'
    inputs:
      versionSpec: '25'
      jdkArchitectureOption: 'x64'
      jdkSourceOption: 'PreInstalled'

  # 2. Run Maven Tests using installed JDK 25
  - task: Maven@4
    displayName: 'Execute Maven Tests on $(imageName)'
    inputs:
      mavenPomFile: 'pom.xml'
      goals: 'clean test'
      options: '-e'
      publishJUnitResults: true
      testResultsFiles: '**/surefire-reports/TEST-*.xml'
      javaHomeOption: 'Path'
      jdkDirectory: '$(JAVA_HOME)'
